# Pulsatile Carreau flow in a plane channel: oscillatory pressure gradient
# G cos(omega t) driving a shear-thinning fluid.
#
# THE FIRST CASE WITH NO EXACT ANALYTIC REFERENCE, and that is the point. The unsteady
# term breaks the force balance every previous analytic reference rested on:
#     tau(y,t) = integral_0^y (du/dt + G(t)) dy'
# The integral depends on the solution, so there is no pointwise rootfind; and
# superposition is gone, so Womersley's Bessel/cosh construction does not
# apply to a nonlinear nu(gammadot). No closed form.
#
# What survives EXACTLY, and is used in full:
#   1. tau_w(t) = h (G(t) - d<u>/dt)  — pure force balance, independent of
#      both rheology and unsteadiness. Convergence gate and exact check.
#   2. Half-wave symmetry u(y, t+T/2) = -u(y, t): G is odd under t -> t+T/2
#      and nu(|gammadot|) is even, so the periodic state must be odd. Any
#      violation is a bug or incomplete periodicity, never physics.
#   3. Two limits, each against an analytic reference already in the repo.
# The profile itself has no analytic reference and is bounded by GCI (ASME V&V 20).
name: womersley_carreau

nondim:
  # NOMINAL Womersley number, defined on nu0: alpha = h sqrt(omega/nu0).
  # The EFFECTIVE value on the wall viscosity is much higher — reported by
  # the runner as alpha_eff, and what the mesh is actually sized on.
  alpha: 10.0
  # Cu = k G h / nu0. Here G is PRESCRIBED (a forcing amplitude, not an
  # output of a mean-velocity constraint), so k follows directly.
  Cu: 10.0
  n: 0.5
  nu_inf_over_nu0: 0.01
  a: 2.0

geometry:
  type: womersley_carreau
  half_height: 1.0
  length: 0.5

resolution:
  # Cells per Stokes layer, with the layer computed from the WALL viscosity
  # (nu_wall < nu0 under thinning => thinner layer => finer mesh). Sizing on
  # nu0 would under-resolve and look like a discretisation problem rather
  # than a mesh-sizing mistake.
  cells_per_stokes_layer: 8
  n_steps_per_cycle: 128

convergence:
  periodicity_tol: 1.0e-6
  max_cycles: 10

limits:
  # Cu -> 0 recovers linear Womersley (exact cosh analytic reference).
  cu_zero: 0.01
  # alpha -> 0 is quasi-steady: at each instant the profile must equal the
  # STEADY Carreau profile for the instantaneous G(t) (exact rootfind analytic reference).
  alpha_small: 0.3
  # nu0 = omega/alpha^2 is LARGE at small alpha, so the viscous Fourier limit
  # (see gci below) bites hard: nt >= 7.9*N^2 here. N=32 with nt=8192 sits at
  # Fourier 2.2; N=80 would need nt > 50000. The Stokes layer spans the whole
  # channel in this limit, so a coarse mesh is physically adequate.
  alpha_small_cells: 32
  alpha_small_steps: 8192
  alpha_small_cycles: 3

gci:
  # ASME V&V 20 on the profile, which has no analytic reference. Combined space-time
  # refinement: refining time alone at fixed mesh hits the spatial phase
  # floor and reports a meaningless order.
  #
  # n_steps scales as n_cells^2, NOT n_cells. Under a variable viscosity the
  # explicit deviatoric term div(nu (grad u)^T) — which vanishes identically
  # for constant nu — imposes a viscous-Fourier limit nu0*dt/dy^2 = O(1).
  # Measured: stable at 1.5 and 3.3, divergent at 13.2. Every level below
  # sits at Fourier 1.73, so the sequence refines space at r = 2 with the
  # temporal error falling as N^-4 and therefore negligible: the observed
  # order is effectively the spatial one.
  levels: [[84, 64], [168, 256], [336, 1024]]
  safety_factor: 1.25
  # If the observed order leaves this band the sequence is not in the
  # asymptotic range and Fs reverts to 3, reported explicitly.
  order_band: [1.5, 2.5]
  fallback_safety_factor: 3.0

metrics:
  - name: identity_max_rel
    tol: 1.0e-6
  - name: half_wave_symmetry
    tol: 1.0e-6
