# Free Brownian motion of a nanoparticle in quiescent blood plasma.
# No flow, no walls, no geometry — and no CFD solver: this case runs on
# runners/langevin.py, the first non-OpenFOAM runner in the harness.
#
# CITATIONS (see betaflow/analytic/brownian.py for the full status note)
#   D = k_B T / (6 pi mu a):      Einstein, A. (1905), Ann. Phys. 322(8):549.
#     user-cited as the Brownian term of Eq. 11 in Grief & Richardson (2005),
#     J. Magn. Magn. Mater. 293:455.
#   <|r(t)-r(0)|^2> = 6 D t:      Einstein (1905).
#   Fluctuation-dissipation form: user-cited as Shah et al. (2011),
#     J. Nanosci. Nanotechnol. 11:919, Eqs 7-8; original Mori et al. (1998),
#     Rheol. Acta 37:151.
#   Discrete Brownian force:      user-cited as Doig et al. (2012),
#     J. Comput. Multiph. Flows 4:85, Eq. 44.
#   The four secondary references are recorded as supplied and are NOT
#   independently verified here; Einstein (1905) is the primary anchor.
name: langevin_free

physical:
  particle_radius: 50.0e-9     # m, a 50 nm nanoparticle
  temperature: 310.0           # K, body temperature
  dynamic_viscosity: 3.5e-3    # Pa s, blood plasma
  particle_density: 1050.0     # kg/m^3, used only for the Stokes-number check
  total_time: 1.0              # s
  # Resulting D = 1.2975e-12 m^2/s, giving an rms displacement of 2.8 um in
  # 1 s. That is the expected order for a 50 nm particle in plasma: water at
  # 37 C would give ~5x more, plasma being ~5x more viscous.

oracle: betaflow.analytic.brownian.msd

study:
  # The convergence axis is PARTICLE COUNT, not resolution: the error is
  # statistical and falls as 1/sqrt(N), so the expected exponent is 0.5, not
  # the 2 of a discretisation study.
  particle_counts: [1000, 10000, 100000]
  replicas: 8
  reference_particles: 100000
  # Slow tier: 20 seeds, checking the DISTRIBUTION of the error rather than
  # one draw from it. The only test that catches a sampler whose mean is
  # right and whose variance is wrong.
  distribution_seeds: 20

metrics:
  # SIGMA-SCALED, not fixed. |r|^2/(2Dt) ~ chi^2_3, so one particle carries
  # relative sd sqrt(6)/3 = 0.8165 and the ensemble carries 0.8165/sqrt(N).
  # A FIXED tolerance on a Monte Carlo quantity always passes at large enough
  # N and therefore tests nothing about the sampler; scaling by the predicted
  # error asks the question that has content — "is the answer within its own
  # error bar" — and is N-independent in units of sigma (failure rate 6.3e-5
  # at 4 sigma, at any N). An RNG with correlated draws inflates the measured
  # spread and fails this immediately while sailing through a fixed 2e-2.
  # COEFFICIENT CORRECTED, and the distribution check is what caught it.
  # sqrt(6)/3 = 0.8165 is the relative sd of the MSD at a SINGLE time
  # (|r|^2/(2Dt) ~ chi^2_3). The metric does not use a single time: it fits a
  # slope through the origin over all sampled times, and those MSD values are
  # correlated — Cov(|r(s)|^2, |r(t)|^2) = 24 D^2 min(s,t)^2 — so the fit is
  # BETTER than any single time. Carrying the sums through gives
  #     sd(slope)/6D = sqrt(18)/6 / sqrt(N) = (1/sqrt(2)) / sqrt(N)
  # Verified three ways: discrete sum 0.707133, independent direct simulation
  # 0.708732, continuum limit 0.707107; and 60 seeds of the runner itself give
  # 0.769 +/- 9%, i.e. RMS z = 1.09 against the derived value.
  #
  # NOTE there are now THREE distinct sigma laws in play, and they must not be
  # interchanged: 0.8165/sqrt(N) for a single-time 3-D MSD, 0.7071/sqrt(N) for
  # this through-origin slope fit, and sqrt(2/N) for a variance estimator such
  # as an axial dispersion coefficient.
  - name: msd_slope_relative
    sigma_coefficient: 0.7071067811865476   # 1/sqrt(2) = sqrt(18)/6
    tol_sigma: 4.0
