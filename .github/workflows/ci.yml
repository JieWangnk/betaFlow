name: betaflow

on:
  push:
  pull_request:
  schedule:
    # Nightly full tier, 02:30 UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  # Tier 1: oracle self-verification. No solver install, seconds to run, so it
  # gates every push regardless of environment. If an oracle is wrong, every
  # case that uses it as ground truth is wrong, so this runs first.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pyyaml pytest
      - run: python -m pytest -m oracle -v

  # Tier 2: the solver cases that are not marked slow. Runs on push.
  solver:
    runs-on: ubuntu-latest
    needs: oracles
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenFOAM 14 (Foundation)
        run: |
          sudo sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get install -y openfoam14
      - run: pip install numpy scipy pyyaml pytest
      - name: Default tier
        run: python -m pytest -m "not slow" -v
      - name: Results must match what is committed
        # The suite rewrites results/; a diff means the NUMBERS moved and the
        # committed record is stale. Provenance is the point of this repo.
        # timestamp and git_sha lines change on every run BY DESIGN, so the
        # gate ignores exactly those two keys and nothing else — as first
        # written it compared them too and would have failed on every run
        # that ever succeeded.
        run: |
          git diff --stat -I'"timestamp"' -I'"git_sha"' -- results/ report/
          git diff --quiet -I'"timestamp"' -I'"git_sha"' -- results/ report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-default
          path: |
            results/
            report/

  # Tier 3: everything, including the multi-minute studies. Nightly only.
  full:
    runs-on: ubuntu-latest
    needs: oracles
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenFOAM 14 (Foundation)
        run: |
          sudo sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get install -y openfoam14
      - run: pip install numpy scipy pyyaml pytest
      - name: Full tier
        run: python -m pytest -m "" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-full
          path: |
            results/
            report/
