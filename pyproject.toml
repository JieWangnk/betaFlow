[project]
name = "betaflow"
version = "0.1.0"
description = "Solver-agnostic validation harness for haemodynamic CFD"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "scipy", "sympy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run excludes the multi-minute studies. Full suite (nightly / CI
# scheduled job):   pytest -m ""
# Slow studies only:                  pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: multi-minute parameter studies (casson grid, womersley_carreau). Excluded by default.",
    "analytic: exact-solution self-verification. Needs NO solver install.",
]
